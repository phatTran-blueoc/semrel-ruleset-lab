name: PR title

# Squash-merge turns the PR title into the commit message on staging, and
# semantic-release reads that message. A title without a valid type is silently
# ignored, so it must fail here. Make the job "Validate PR title" a required check.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
    branches: [staging]

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
